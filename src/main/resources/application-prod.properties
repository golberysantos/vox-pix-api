# ===================================================================
# AMBIENTE: PRODUCAO (MySQL Database + Real AI Integration)
# ===================================================================

# Banco de Dados MySQL (Dockerized)
spring.datasource.url=jdbc:mysql://localhost:3306/voxpixdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=voxpix_user
spring.datasource.password=voxpix_pass

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desativa o Console do H2
spring.h2.console.enabled=false

# URLs e Credenciais Reais de Integracao com IA (injetadas do ambiente)
api.groq.url=https://api.groq.com/openai
api.groq.key=${GROQ_API_KEY}

api.gemini.url=https://generativelanguage.googleapis.com
api.gemini.key=${GEMINI_API_KEY}
